<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Welcome</title>
  <meta name="description" content="William Gault — private file access.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#173a66">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="icon" type="image/svg+xml" href="assets/logo/wg-logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/Figtree-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/img/beach.jpg" as="image">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" aria-labelledby="title">
      <img class="logo" src="assets/logo/wg-logo.svg" alt="" width="64" height="64">
      <h1 id="title">Welcome</h1>
      <p class="subtitle" id="subtitle">Enter your access code</p>

      <form class="code" id="code-form" autocomplete="off" novalidate>
        <fieldset aria-describedby="subtitle status">
          <legend class="sr-only">Four-digit access code</legend>
          <div class="digits" id="digits">
            <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   autocomplete="one-time-code" aria-label="Digit 1 of 4" autofocus>
            <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   autocomplete="off" aria-label="Digit 2 of 4">
            <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   autocomplete="off" aria-label="Digit 3 of 4">
            <input class="digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   autocomplete="off" aria-label="Digit 4 of 4">
          </div>
        </fieldset>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <a href="https://files.gaultb.com/login" rel="noopener">Sign in</a>
  </footer>

  <noscript><p class="noscript">This page needs JavaScript to check your access code.</p></noscript>

  <script src="config/codes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
